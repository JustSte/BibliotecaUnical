#Keycloak config for Oauth2
spring.security.oauth2.client.registration.keycloak.client-id=BibliotecaUnical
spring.security.oauth2.client.registration.keycloak.scope=openid
spring.security.oauth2.client.provider.keycloak.issuer-uri = http://localhost:8081/realms/BibliotecaUnical

#Keycloak config for adapter
keycloak.auth-server-url=http://localhost:8081
keycloak.realm=BibliotecaUnical
keycloak.resource=BibliotecaUnical
keycloak.public-client=true
keycloak.principal-attribute=sub

#Config admin client
