spring.application.name=BibliotecaUnical
logging.level.org.springframework= info

#Keycloak config for Oauth2
spring.security.oauth2.client.registration.keycloak.client-id=BibliotecaUnical
spring.security.oauth2.client.registration.keycloak.scope=openid
spring.security.oauth2.client.provider.keycloak.issuer-uri = http://localhost:8081/realms/BibliotecaUnical

#Keycloak configuration for resource server
spring.security.oauth2.resourceserver.jwt.issuer-uri = http://localhost:8081/realms/BibliotecaUnical

logging.level.root=WARN
logging.level.com.Stefan.BibliotecaUnical=TRACE

spring.datasource.url = jdbc:postgresql://localhost:5432/BibliotecaUnical
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name = org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.data.redis.host=localhost
spring.data.redis.port=6379
//spring.data.redis.username=
//spring.data.redis.password=
spring.cache.type = redis