keycloak.admin.username=admin
keycloak.admin.password=admin
keycloak.admin.realm=BibliotecaUnical

#Keycloak configuration for resource server
spring.security.oauth2.resourceserver.jwt.issuer-uri = http://localhost:8081/realms/BibliotecaUnical



